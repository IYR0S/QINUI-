plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qins.uistudio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qins.uistudio'
        minSdk 19
        targetSdk 19
        versionCode 7
        versionName '0.7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
